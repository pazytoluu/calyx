<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Playbook Relation Client | Calyx Solution Client</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
</head>
<body>

{% include "_header.html" %}

<main>
    <section class="section">
        <div class="container grid grid-2" style="align-items: center;">

            <div class="text-center">
                <img
                        src="{{ url_for('static', filename=product.image) }}"
                        alt="{{ product.title }}"
                >
            </div>

            <div>
                <h2 style="text-transform: lowercase;">{{ product.title }}</h2>
                <p class="text-small" style="font-size: 1.3rem; color: var(--color-text); font-weight: 700;">
                    {{ product.price }}
                </p>

                <a href="{{ url_for('book_checkout') }}" class="btn" style="width: 100%; margin: 20px 0;">
                    Commander et payer
                </a>

                <p>{{ product.description }}</p>
            </div>

        </div>
    </section>
</main>

{% include "_footer.html" %}

</body>
</html>
